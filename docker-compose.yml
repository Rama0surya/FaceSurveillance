services:
  # ----------------------------------------------------------------
  # MediaMTX — RTSP proxy server (optional but recommended)
  # ----------------------------------------------------------------
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: face_surveillance_mediamtx
    ports:
      - "8554:8554"   # RTSP
      - "1935:1935"   # RTMP
      - "8888:8888"   # HLS
      - "9997:9997"   # API
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml
    restart: unless-stopped

  # ----------------------------------------------------------------
  # Backend — FastAPI + AI detection engine
  # ----------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: face_surveillance_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENV=development
      - MEDIAMTX_API_URL=http://mediamtx:9997
      - MEDIAMTX_RTSP_URL=rtsp://mediamtx:8554
      - USE_MEDIAMTX=true
    volumes:
      - ./backend:/app
      - ./snapshots:/app/snapshots
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - mediamtx
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    # GPU support — Docker will ignore this if no NVIDIA runtime is available
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ----------------------------------------------------------------
  # Frontend — React + Vite dashboard
  # ----------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: face_surveillance_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: fs_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: face_surveillance
      MYSQL_USER: nvruser
      MYSQL_PASSWORD: user123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - fs_network
    command: --innodb_flush_log_at_trx_commit=2 --sync_binlog=0
    deploy:
      resources:
        limits:
          memory: 1G

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: fs_mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"
      - "1935:1935"
      - "8888:8888"
      - "9997:9997"
    networks:
      - fs_network
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    build: 
      context: ./backend
      args:
        - USE_GPU=true
    container_name: fs_backend
    restart: unless-stopped
    environment:
      - ENV=production
      - DATABASE_URL=mysql+pymysql://nvruser:user123@database:3306/face_surveillance
      - MEDIAMTX_API_URL=http://mediamtx:9997
      - MEDIAMTX_RTSP_URL=rtsp://mediamtx:8554
      - USE_MEDIAMTX=true
      - SNAPSHOT_STORAGE=local
      - USE_GPU=auto
      - WORKERS=4
    ports:
      - "8000:8000"
    volumes:
      - ./backend/snapshots:/app/snapshots
    depends_on:
      - database
    networks:
      - fs_network
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
    container_name: fs_frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - fs_network
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  fs_network:
    driver: bridge

volumes:
  mysql_data:

services:
  database:
    image: mysql:8.0
    container_name: fs_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD} # Reusing your password variable
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - fs_network
    command: --innodb_flush_log_at_trx_commit=2 --sync_binlog=0
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      # Variables are passed to the healthcheck command
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: fs_mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"
      - "1935:1935"
      - "8888:8888"
      - "9997:9997"
    networks:
      - fs_network
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    build: 
      context: ./backend
      args:
        - USE_GPU=${USE_GPU}
    container_name: fs_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/snapshots:/app/snapshots
      - ./models/yolov8n-face.pt:/app/yolov8n-face.pt
    depends_on:
      database:
        condition: service_healthy
    networks:
      - fs_network

  frontend:
    build:
      context: ./frontend
    container_name: fs_frontend
    restart: unless-stopped
    environment:
      # Injecting values into your frontend environment
      - VITE_API_URL=http://${SERVER_IP}:8000 
      - VITE_WS_URL=http://${SERVER_IP}:8554 
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - fs_network
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  fs_network:
    driver: bridge

volumes:
  mysql_data:

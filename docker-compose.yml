name: face-surveillance

networks:
  web-network:
    external: true

volumes:
  insightface_models:

services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: face_surveillance_mediamtx
    expose:
      - "8554"   # RTSP — hanya untuk backend
      - "8888"   # HLS  — hanya untuk backend (proxy)
      - "9997"   # API  — hanya untuk backend
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped
    networks:
      - web-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: face_surveillance_backend
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - ENV=production
      - MEDIAMTX_API_URL=http://mediamtx:9997
      - MEDIAMTX_RTSP_URL=rtsp://mediamtx:8554
      - MEDIAMTX_HLS_URL=http://mediamtx:8888   # ← untuk HLS proxy
      - USE_MEDIAMTX=true
    volumes:
      - ./snapshots:/app/snapshots
      - ./backend/models/yolov8n-face-lindevs.pt:/app/yolov8n-face-lindevs.pt
      - insightface_models:/home/appuser/.insightface
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - mediamtx
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - web-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://api.facesurveillance.verloxes.my.id
        VITE_WS_URL: wss://api.facesurveillance.verloxes.my.id
        # Tidak perlu VITE_MEDIAMTX_URL — HLS diproxy lewat backend
    container_name: face_surveillance_frontend
    expose:
      - "5173"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - web-network
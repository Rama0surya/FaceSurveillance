###############################################
# Global settings -> General
###############################################
logLevel: info
logDestinations: [stdout]
logStructured: false
logFile: mediamtx.log

readTimeout: 10s
writeTimeout: 10s
writeQueueSize: 512
udpMaxPayloadSize: 1452
udpReadBufferSize: 0

###############################################
# Global settings -> Authentication (Disabled for Local Dev)
###############################################
authMethod: internal
authInternalUsers:
- user: any
  pass:
  ips: []
  permissions:
  - action: publish
    path:
  - action: read
    path:
  - action: playback
    path:
- user: any
  pass:
  ips: ['127.0.0.1', '::1']
  permissions:
  - action: api
  - action: metrics
  - action: pprof

###############################################
# Global settings -> Control API (Required by FastAPI Backend)
###############################################
api: true
apiAddress: :9997
apiEncryption: false
apiAllowOrigins: ['*']

###############################################
# Servers Protocols Enabled
###############################################
# RTSP Server configuration (Primary use-case for Face Surveillance)
rtsp: true
rtspTransports: [udp, multicast, tcp]
rtspEncryption: "no"
rtspAddress: :8554
rtpAddress: :8000
rtcpAddress: :8001

# Other servers (Keep enabled for web stream compatibility)
rtmp: true
rtmpAddress: :1935
hls: true
hlsAddress: :8888
hlsVariant: lowLatency
webrtc: true
webrtcAddress: :8889
srt: true
srtAddress: :8890

###############################################
# Default path settings
###############################################
pathDefaults:
  source: publisher
  sourceOnDemand: false
  maxReaders: 0
  record: false

###############################################
# Path settings (FIXED FOR YOUR PROJECT)
###############################################
paths:
  # FIX BUG 404: Mengubah source menjadi 'webcam' agar MediaMTX langsung 
  # mengambil video dari Kamera Laptop Windows kamu tanpa perlu FFmpeg / script tambahan.
  # cam_4ae7a78d_11aa_4f2f_a673_93e623e0e075:
  #   source: webcam
  #   sourceOnDemand: false

  # Fallback untuk pencarian path lainnya
  all_others:
    source: publisher
    record: false
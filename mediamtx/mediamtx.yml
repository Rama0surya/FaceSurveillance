logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: :9997
apiEncryption: no

authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: api
      - action: read
      - action: publish
      - action: playback

rtsp: yes
rtspAddress: :8554

hls: yes
hlsAddress: :8888
hlsAllowOrigins: ["*"]    # fix: was hlsAllowOrigin
hlsAlwaysRemux: yes
hlsSegmentDuration: 2s

rtmp: no
webrtc: no
srt: no

paths:
  all:
    source: publisher

###############################################################################
# mediamtx.yml — Docker configuration
###############################################################################

logLevel: info
logDestinations: [stdout]

# API — no encryption, no auth
api: yes
apiAddress: :9997
apiEncryption: no

# Explicitly allow unauthenticated access to API, publish, and read
authInternalUsers:
  - user: any
    pass: 
    ips: []
    permissions:
      - action: api
      - action: read
      - action: publish
      - action: playback

# RTSP
rtsp: yes
rtspAddress: :8554

# HLS
hls: yes
hlsAddress: :8888
hlsAllowOrigin: "*"
hlsAlwaysRemux: yes
hlsSegmentDuration: 2s

# Disable unused protocols
rtmp: no
webrtc: no
srt: no

paths:
  all:
    source: publisher